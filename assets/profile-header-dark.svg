<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 252" width="100%" height="252">
  <defs>
    <pattern id="grid-dark" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E242C" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent-line-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="1"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1E242C" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="glass-blue-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="glass-slate-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363D" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#161B22" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="ambient-glow-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas & Grid -->
  <rect width="1200" height="252" rx="12" fill="#0D1117"/>
  <rect width="1200" height="252" rx="12" fill="url(#grid-dark)" opacity="0.65"/>
  <circle cx="1035" cy="148" r="130" fill="url(#ambient-glow-dark)">
    <animate attributeName="r" values="120;142;120" dur="7s" repeatCount="indefinite"/>
  </circle>
  <rect x="0.5" y="0.5" width="1199" height="251" rx="11.5" fill="none" stroke="#21262D" stroke-width="1"/>

  <!-- Top Telemetry Bar -->
  <circle cx="56" cy="44" r="4" fill="#2563EB">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <text x="70" y="48" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Geist', 'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="2.2">SYSTEMS ARCHITECTURE &amp; ENTERPRISE ENGINEERING</text>
  <text x="1148" y="48" text-anchor="end" fill="#6E7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">ISTANBUL · TR</text>

  <!-- Divider Line with Animated Data Pulse -->
  <line x1="52" y1="66" x2="1148" y2="66" stroke="url(#accent-line-dark)" stroke-width="1.5"/>
  <rect x="52" y="65" width="90" height="2.5" rx="1.25" fill="#60A5FA" opacity="0.85">
    <animate attributeName="x" values="52;1058;52" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- Right-Side Floating Geometric Architecture Shapes (Animated) -->
  <g transform="translate(1035, 152)">
    <!-- Shape 1: Outer Translucent Isometric Frame -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,-6; 0,6; 0,-6" dur="6.5s" repeatCount="indefinite"/>
      <rect x="-74" y="-58" width="116" height="116" rx="18" fill="url(#glass-slate-dark)" stroke="#30363D" stroke-width="1.2" transform="rotate(-12)"/>
    </g>

    <!-- Shape 2: Middle Blue Architectural Prism -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,7; 0,-7; 0,7" dur="5.2s" repeatCount="indefinite"/>
      <rect x="-32" y="-52" width="104" height="104" rx="16" fill="url(#glass-blue-dark)" stroke="#2563EB" stroke-opacity="0.65" stroke-width="1.2" transform="rotate(14)"/>
    </g>

    <!-- Shape 3: Inner Orbiting Node & Precision Ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="6 6"/>
      <circle cx="34" cy="0" r="3.5" fill="#60A5FA"/>
      <circle cx="-34" cy="0" r="2.5" fill="#2563EB"/>
    </g>

    <!-- Core Achord Geometric Mark -->
    <g transform="translate(-14, -14) scale(0.014)" fill="#F0F6FC" opacity="0.92">
      <animate attributeName="opacity" values="0.95;0.65;0.95" dur="4.5s" repeatCount="indefinite"/>
      <path d="M0,0h667.71C801.38,0,909.9,108.52,909.9,242.19v146.92c0,280.76-227.94,508.71-508.71,508.71H0V0H0Z"/>
      <path d="M1090.1,0h909.9v897.81h-350.77c-308.59,0-559.13-250.54-559.13-559.13V0h0Z"/>
      <path d="M1.27,1100.97h363.19c301.74,0,546.71,244.97,546.71,546.71v351.1H1.27v-897.81h0Z"/>
      <path d="M1598.76,1102.19h396.75c2.48,0,4.49,2.01,4.49,4.49v888.82c0,2.48-2.01,4.49-4.49,4.49h-663.17c-133.69,0-242.24-108.54-242.24-242.24v-146.92c0-280.74,227.92-508.66,508.66-508.66Z"/>
    </g>
  </g>

  <!-- Stationary Headline & Subtitle -->
  <text x="52" y="124" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Geist', 'Inter', sans-serif" font-size="36" font-weight="700" letter-spacing="-0.9">Founder &amp; Systems Architect</text>
  <text x="52" y="158" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Geist', 'Inter', sans-serif" font-size="17.5" font-weight="400" letter-spacing="-0.15">Designing distributed backend platforms, developer ecosystems, and local-first software engines.</text>

  <!-- Architectural Pillar Pills -->
  <g transform="translate(52, 186)">
    <rect x="0" y="0" width="194" height="32" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="97" y="20" text-anchor="middle" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500">Enterprise Platforms</text>

    <rect x="206" y="0" width="194" height="32" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="303" y="20" text-anchor="middle" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500">Distributed Systems</text>

    <rect x="412" y="0" width="194" height="32" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="509" y="20" text-anchor="middle" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500">Native macOS Systems</text>

    <rect x="618" y="0" width="212" height="32" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="724" y="20" text-anchor="middle" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500">Zero-Trust Architecture</text>
  </g>
</svg>
